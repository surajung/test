name: Deploy To Mac Mini

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-macmini-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.MAC_HOST }}
          username: ${{ secrets.MAC_USER }}
          key: ${{ secrets.MAC_SSH_KEY }}
          port: ${{ secrets.MAC_PORT }}
          script_stop: true
          script: |
            set -e
            cd ~/www/project
            git pull --ff-only origin main
            docker-compose up -d --build
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" | grep test-surajung-web || true
